<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آکادمی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #f4f6f9);
      color: var(--tg-theme-text-color, #222);
    }
    .header { text-align: center; padding: 15px 0; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card h3 { margin-top: 0; color: var(--tg-theme-link-color, #2481cc); }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="userName">سلام، خوش آمدید 🌿</h2>
    <p>سامانه جامع آموزش و ارزیابی آکادمی</p>
  </div>
  <div class="card">
    <h3>📚 ترم‌ها و جلسات</h3>
    <p>مشاهده جلسات، فایل‌های جزوه و صوت‌های آموزشی</p>
    <button class="btn" onclick="openSection('ترم‌ها')">ورود به دوره</button>
  </div>
  <div class="card">
    <h3>🗂 فلش‌کارت و آزمون</h3>
    <p>مرور سوالات کلیدی و ثبت امتیاز</p>
    <button class="btn" onclick="openSection('فلش‌کارت')">شروع آزمون</button>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('userName').innerText = 'سلام ' + tg.initDataUnsafe.user.first_name + ' عزیز 🌿';
    }
    function openSection(name) {
      tg.showAlert('بخش ' + name + ' انتخاب شد.');
    }
  </script>
</body>
</html>
